name: WA system checks

on:
  pull_request:
    paths:
      - "wa-system/**"
      - ".github/workflows/whatsapp-python-check.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "wa-system/**"
      - ".github/workflows/whatsapp-python-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa-system

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wa-system/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        shell: bash
        run: set -o pipefail; pytest -q --tb=short 2>&1 | tee pytest-output.txt
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa-pytest-output
          path: wa-system/pytest-output.txt
          if-no-files-found: error
