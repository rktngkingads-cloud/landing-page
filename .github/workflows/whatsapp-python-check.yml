name: WhatsApp Python checks

on:
  pull_request:
    paths:
      - "whatsapp-python/**"
      - ".github/workflows/whatsapp-python-check.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "whatsapp-python/**"
      - ".github/workflows/whatsapp-python-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-python

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whatsapp-python/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        run: pytest -q
